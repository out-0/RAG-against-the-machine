<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="description"
            content="Your repository is indexed and ready for questions."
        />
        <title>Ask your repository</title>
        <style>
            :root {
                color-scheme: light;
                --paper: #f7f4ec;
                --ink: #1d3029;
                --muted: #6d776e;
                --line: #d9ded3;
                --green: #245c45;
                --orange: #d66b45;
            }

            * {
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;
                margin: 0;
                display: grid;
                place-items: center;
                padding: 28px;
                color: var(--ink);
                background:
                    radial-gradient(
                        ellipse at 50% 42%,
                        rgba(224, 232, 214, 0.72),
                        transparent 54%
                    ),
                    var(--paper);
                font-family: Georgia, "Times New Roman", serif;
            }

            main {
                width: min(100%, 1650px);
                min-height: min(1020px, calc(100vh - 56px));
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: clamp(32px, 7vw, 62px);
                border: 1px solid var(--line);
                border-radius: 5px;
                background: rgba(255, 254, 250, 0.82);
                box-shadow: 0 24px 70px rgba(29, 48, 41, 0.08);
                animation: arrive 500ms ease-out both;
            }

            .eyebrow {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 9px;
                margin: 0 0 29px;
                color: var(--green);
                font:
                    600 clamp(12px, 0.8vw, 14px) / 1.4 "Courier New",
                    monospace;
                letter-spacing: 0.11em;
                text-transform: uppercase;
            }

            .status-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: var(--orange);
                box-shadow: 0 0 0 4px rgba(214, 107, 69, 0.12);
            }

            h1 {
                margin: 0;
                font-size: clamp(42px, 5.5vw, 88px);
                font-weight: 400;
                letter-spacing: -0.045em;
                line-height: 1.02;
                text-align: center;
            }

            .repo {
                overflow-wrap: anywhere;
                margin: 15px 0 34px;
                color: var(--muted);
                font:
                    clamp(14px, 1vw, 17px) / 1.6 "Courier New",
                    monospace;
                text-align: center;
            }

            form,
            .repo-link {
                width: min(100%, 900px);
            }

            label {
                display: block;
                margin-bottom: 10px;
                font-size: clamp(17px, 1.3vw, 20px);
            }

            textarea {
                display: block;
                width: 100%;
                min-height: clamp(124px, 12vw, 190px);
                resize: vertical;
                padding: 15px 16px;
                border: 1px solid var(--line);
                border-radius: 3px;
                outline: none;
                color: var(--ink);
                background: #fffefa;
                font:
                    clamp(17px, 1.2vw, 20px) / 1.5 Georgia,
                    "Times New Roman",
                    serif;
                transition:
                    border-color 160ms ease,
                    box-shadow 160ms ease;
            }

            textarea::placeholder {
                color: #9aa198;
            }

            textarea:focus-visible {
                border-color: var(--green);
                box-shadow: 0 0 0 3px rgba(36, 92, 69, 0.12);
            }

            .note {
                width: min(100%, 900px);
                margin: 14px 0 0;
                color: var(--muted);
                font:
                    clamp(14px, 0.9vw, 16px) / 1.5 "Courier New",
                    monospace;
                text-align: center;
            }

            button {
                display: flex;
                width: 100%;
                min-height: clamp(52px, 5.5vw, 72px);
                align-items: center;
                justify-content: space-between;
                margin-top: 12px;
                padding: 0 22px;
                border: 0;
                border-radius: 3px;
                color: #fffefa;
                background: var(--green);
                cursor: pointer;
                font:
                    600 clamp(15px, 1.1vw, 18px) / 1 "Courier New",
                    monospace;
                letter-spacing: 0.02em;
                transition:
                    background-color 160ms ease,
                    transform 160ms ease;
            }

            button:hover {
                background: #194733;
            }

            button:active {
                transform: translateY(1px);
            }

            button:focus-visible {
                outline: 3px solid rgba(36, 92, 69, 0.3);
                outline-offset: 3px;
            }

            .loading-state {
                display: grid;
                width: 100%;
                min-height: clamp(52px, 5.5vw, 72px);
                place-items: center;
                margin-top: 12px;
            }

            .loading-state[hidden] {
                display: none;
            }

            .loading-spinner {
                width: 26px;
                height: 26px;
                border: 3px solid var(--line);
                border-top-color: var(--green);
                border-radius: 50%;
                animation: spin 750ms linear infinite;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            .repo-link {
                display: flex;
                min-height: 46px;
                align-items: center;
                justify-content: center;
                gap: 8px;
                margin-top: 20px;
                border: 1px solid var(--line);
                border-radius: 3px;
                color: var(--green);
                font:
                    600 clamp(14px, 0.9vw, 16px) / 1 "Courier New",
                    monospace;
                text-decoration: none;
                transition:
                    border-color 160ms ease,
                    background-color 160ms ease;
            }

            .repo-link:hover {
                border-color: var(--green);
                background: rgba(36, 92, 69, 0.04);
            }

            .repo-link:focus-visible {
                outline: 3px solid rgba(36, 92, 69, 0.3);
                outline-offset: 3px;
            }

            @keyframes arrive {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @media (prefers-reduced-motion: reduce) {
                *,
                *::before,
                *::after {
                    animation-duration: 0.01ms !important;
                    animation-iteration-count: 1 !important;
                    scroll-behavior: auto !important;
                    transition-duration: 0.01ms !important;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <p class="eyebrow">
                <span class="status-dot" aria-hidden="true"></span>
                Repository indexed
            </p>
            <h1>Ask what’s inside.</h1>
            <p class="repo">$repository</p>
            <form class="ask-form" action="/ask" method="post">
                <input type="hidden" name="owner" value="$owner" />
                <input type="hidden" name="repository" value="$repository" />
                <label for="prompt">What would you like to know?</label>
                <textarea
                    id="prompt"
                    name="query"
                    placeholder="Where is authentication handled?"
                    autocomplete="off"
                    required
                ></textarea>
                <button type="submit">
                    <span>Find an answer</span>
                    <span aria-hidden="true">→</span>
                </button>
                <div
                    class="loading-state"
                    role="status"
                    aria-label="Generating answer"
                    hidden
                >
                    <span class="loading-spinner" aria-hidden="true"></span>
                </div>
            </form>
            <p class="note">
                Answers are grounded in the indexed Python and Markdown files.
            </p>
            <a class="repo-link" href="/">Try another repository</a>
        </main>
        <script>
            document.querySelectorAll(".ask-form").forEach((form) => {
                form.addEventListener("submit", () => {
                    form.querySelector('button[type="submit"]').hidden = true;
                    form.querySelector(".loading-state").hidden = false;
                });
            });
        </script>
    </body>
</html>
